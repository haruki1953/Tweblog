name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  id-token: write
  contents: write
  attestations: write
  packages: write

jobs:
  # -------------------------------------------------------
  # 前端构建：tweet-blog-vue3（主管理前端）
  # -------------------------------------------------------
  frontend-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tweet-blog-vue3/pnpm-lock.yaml

      - name: Install deps
        run: |
          cd tweet-blog-vue3
          pnpm install --frozen-lockfile

      - name: Build admin frontend
        run: |
          cd tweet-blog-vue3
          pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: tweet-blog-vue3/dist

  # -------------------------------------------------------
  # 前端构建：tweet-blog-public-vue3（公开前端）
  # -------------------------------------------------------
  frontend-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tweet-blog-public-vue3/pnpm-lock.yaml

      - name: Install deps
        run: |
          cd tweet-blog-public-vue3
          pnpm install --frozen-lockfile

      - name: Build public frontend
        run: |
          cd tweet-blog-public-vue3
          pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: public-dist
          path: tweet-blog-public-vue3/dist

  # -------------------------------------------------------
  # 前端构建：tweblog-electron-vue3（桌面端前端）
  # -------------------------------------------------------
  frontend-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tweblog-electron-vue3/pnpm-lock.yaml

      - name: Install deps
        run: |
          cd tweblog-electron-vue3
          pnpm install --frozen-lockfile

      - name: Build desktop frontend
        run: |
          cd tweblog-electron-vue3
          pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: tweblog-electron-vue3/dist

  # -------------------------------------------------------
  # 前端构建：Tweblog 文档（VitePress）
  # -------------------------------------------------------
  frontend-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Tweblog/pnpm-lock.yaml

      - name: Install deps
        run: |
          cd Tweblog
          pnpm install --frozen-lockfile

      - name: Build docs
        run: |
          cd Tweblog
          export LOCAL_DOCS=true
          pnpm docs:build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: Tweblog/.vitepress/dist

  # -------------------------------------------------------
  # Docker 构建（tweet-blog-hono）
  # -------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend-admin, frontend-public]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: public-dist
          path: tweet-blog-hono/static

      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: tweet-blog-hono/static/admin

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: tweet-blog-hono
          file: tweet-blog-hono/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate Docker attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

  # -------------------------------------------------------
  # Electron 构建（tweblog-electron-hono）
  # -------------------------------------------------------
  electron-build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - windows-11-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-13
          - macos-15
    runs-on: ${{ matrix.os }}
    needs: [frontend-admin, frontend-public, frontend-desktop, frontend-docs]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: public-dist
          path: tweblog-electron-hono/static

      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: tweblog-electron-hono/static/admin

      - uses: actions/download-artifact@v4
        with:
          name: desktop-dist
          path: tweblog-electron-hono/static/desktop

      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: tweblog-electron-hono/static/docs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: tweblog-electron-hono/yarn.lock

      - name: Install deps
        run: |
          cd tweblog-electron-hono
          yarn install --frozen-lockfile

      - name: Build dist js
        run: |
          cd tweblog-electron-hono
          yarn build

      - name: Build Electron
        run: |
          cd tweblog-electron-hono
          yarn make

      - name: Upload Release ZIP
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tweblog-electron-hono/out/make/*/*/*/*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

      - name: Attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: tweblog-electron-hono/out/make/*/*/*/*
